<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factoid Pipeline Overview</title>
<meta name="description" content="Architecture walkthrough of the factoid award pipeline.">
<meta property="og:title" content="Factoid Pipeline Overview">
<meta property="og:description" content="Architecture walkthrough of the factoid award pipeline.">
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }
  #tap {
    position: fixed; inset: 0; z-index: 2; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: max(24px, env(safe-area-inset-bottom)); font: 600 15px/1 system-ui, sans-serif; color: #fff;
    background: transparent; border: 0; cursor: pointer;
  }
  #tap span { background: rgba(0,0,0,.6); padding: 10px 16px; border-radius: 999px; }
  #tap[hidden] { display: none; }
</style>
</head>
<body>
<div id="player"></div>
<button id="tap" aria-label="Unmute"><span>🔊 Tap for sound</span></button>
<script>
  // Plays the video fullscreen. Browsers only allow muted autoplay, so the first tap or key unmutes it.
  const ID = "dQw4w9WgXcQ";
  const fallback = () => location.replace("https://www.youtube.com/watch?v=" + ID);
  const tap = document.getElementById("tap");
  let player;

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("player", {
      videoId: ID,
      host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 0, loop: 1, playlist: ID, rel: 0, modestbranding: 1 },
      events: {
        onReady: e => e.target.playVideo(),
        onError: fallback,
      },
    });
  };

  const unmute = () => {
    if (!player || !player.unMute) return;
    player.unMute();
    player.setVolume(100);
    player.playVideo();
    tap.hidden = true;
  };
  for (const ev of ["pointerdown", "touchstart", "keydown"]) addEventListener(ev, unmute, { passive: true });

  // Sends the visitor straight to YouTube when the embed API never loads (blocked or offline).
  setTimeout(() => { if (!player || !player.getPlayerState) fallback(); }, 6000);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
